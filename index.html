<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cinabrio — Colección de Modelos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #08050f;
    --bg-deep: #040209;
    --surface: #150f2c;
    --surface2: #1c1539;
    --surface3: #251c49;
    --border: rgba(231,198,132,0.12);
    --border-hover: rgba(231,198,132,0.34);
    /* ── Acentos cálidos: coral → durazno (el choque cálido-frío) ── */
    --coral: #ff8873;
    --peach: #ffdf9c;
    --accent: #ff8873;              /* alias cálido para spinners/enlaces */
    --accent-dim: rgba(255,136,115,0.14);
    --gold: #e7c684;               /* separadores dorados finos */
    --gold-dim: rgba(231,198,132,0.22);
    --teal: #7fd0bb;               /* zona inferior verde-salvia/teal */
    --ink: #201636;                /* texto oscuro sobre pastilla cálida */
    /* ── Texto crema cálido sobre fondo frío ── */
    --text: #f7ecdb;
    --text-sec: #d3c3d8;
    --text-muted: #998aab;
    --text-dim: #5a4d78;
    /* ── Colores de tag (armonizados con la nueva paleta) ── */
    --lora-color: #ffb98f;
    --checkpoint-color: #b9a0ff;
    --other-color: #8ec7e6;
    --illus-color: #7fd0bb;
    --pony-color: #ff9ec9;
    --ctrl-h: 54px;
    --side-w: 244px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto Mono', monospace; font-weight: 300;
    min-height: 100vh; overflow-x: hidden;
  }

  /* ── Fondo por capas: cielo estrellado arriba (con brillo cálido) ── */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1.1px 1.1px at 27% 8%,  rgba(255,223,156,0.55), transparent),
      radial-gradient(1.4px 1.4px at 44% 22%, rgba(255,255,255,0.40), transparent),
      radial-gradient(1.1px 1.1px at 63% 12%, rgba(255,255,255,0.50), transparent),
      radial-gradient(1.3px 1.3px at 78% 24%, rgba(255,223,156,0.45), transparent),
      radial-gradient(1.1px 1.1px at 90% 9%,  rgba(255,255,255,0.42), transparent),
      radial-gradient(1.2px 1.2px at 33% 34%, rgba(255,255,255,0.30), transparent),
      radial-gradient(1.1px 1.1px at 71% 38%, rgba(255,223,156,0.30), transparent),
      radial-gradient(120% 70% at 50% -12%, rgba(255,136,115,0.14), transparent 55%);
    background-repeat: no-repeat;
  }

  /* ── Fondo por capas: nubes/olas teal abajo, el contenido flota encima ── */
  body::after {
    content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 46vh;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(60% 90% at 12% 128%, rgba(127,208,187,0.22), transparent 62%),
      radial-gradient(55% 85% at 42% 132%, rgba(127,208,187,0.18), transparent 62%),
      radial-gradient(60% 90% at 74% 126%, rgba(127,208,187,0.20), transparent 62%),
      radial-gradient(70% 95% at 96% 134%, rgba(127,208,187,0.16), transparent 62%),
      linear-gradient(to top, rgba(127,208,187,0.10), transparent 78%);
  }

  /* ── Header / hero ── */
  header {
    position: relative; z-index: 10; padding: 3.25rem 2rem 2.25rem;
    border-bottom: 1px solid var(--gold-dim);
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem; text-align: center;
  }
  .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold); font-weight: 400; font-family: 'Roboto Mono', monospace;
  }
  h1 {
    font-family: 'Cinzel', serif; font-size: clamp(2.2rem, 5.5vw, 3.8rem);
    font-weight: 700; letter-spacing: 0.1em; line-height: 1.1;
    /* wordmark cinabrio: mismo gradiente cálido que la pastilla estrella */
    background: linear-gradient(45deg, var(--coral) 15%, var(--peach) 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 0.8rem; color: var(--text-sec); margin-top: 0.15rem;
    letter-spacing: 0.08em; font-weight: 300;
  }

  /* ── Stats ── */
  .stats-bar {
    position: relative; z-index: 10;
    display: flex; justify-content: center; gap: 2.5rem;
    padding: 1.35rem 2rem; border-bottom: 1px solid var(--gold-dim); flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 0.18rem; }
  .stat-val {
    font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 600;
    background: linear-gradient(45deg, var(--coral), var(--peach));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .stat-label {
    font-size: 0.64rem; color: var(--text-sec); letter-spacing: 0.14em;
    text-transform: uppercase; font-family: 'Roboto Mono', monospace;
  }

  /* ── Controls (sticky) ── */
  .controls {
    position: sticky; top: 0; z-index: 100;
    display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center;
    padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--gold-dim);
    background: rgba(8,5,15,0.95); backdrop-filter: blur(12px);
    min-height: var(--ctrl-h);
  }
  .search-wrap { position: relative; flex: 1; min-width: 160px; max-width: 300px; }
  .search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: 0.45; pointer-events: none; z-index: 1; color: var(--peach); }

  /* ── Autocomplete dropdown ── */
  .ac-dropdown {
    display: none; position: absolute; top: calc(100% + 5px); left: 0; right: 0;
    background: var(--surface2); border: 1px solid var(--border-hover);
    border-radius: 12px; overflow: hidden; z-index: 500;
    box-shadow: 0 10px 30px rgba(10,6,24,0.55);
  }
  .ac-dropdown.open { display: block; }
  .ac-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 0.9rem; cursor: pointer; gap: 10px;
    transition: background 0.12s; border: none; background: none;
    width: 100%; text-align: left; font-family: 'Roboto Mono', monospace;
  }
  .ac-item:hover, .ac-item.focused { background: var(--surface3); }
  .ac-item-tag { font-size: 0.78rem; color: var(--text-sec); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.02em; }
  .ac-item-tag em { color: var(--peach); font-style: normal; font-weight: 500; }
  .ac-item-count { font-size: 0.68rem; color: var(--text-muted); flex-shrink: 0; background: var(--surface); padding: 0.1rem 0.55rem; border-radius: 20px; border: 1px solid var(--border); }

  /* Buscador: pastilla */
  input[type="text"] {
    width: 100%; padding: 0.5rem 1rem 0.5rem 2.4rem;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 50px;
    color: var(--text); font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 300;
    letter-spacing: 0.03em; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="text"]:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,136,115,0.14); }
  input[type="text"]::placeholder { color: var(--text-muted); }

  .fg { display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center; }
  .vsep { width: 1px; height: 18px; background: var(--gold-dim); margin: 0 0.15rem; }

  /* Filtros: pastillas outline; activas se rellenan */
  .fb {
    padding: 0.4rem 0.95rem; border-radius: 50px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-family: 'Roboto Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .fb:hover { border-color: var(--border-hover); color: var(--text-sec); }
  .fb.active        { background: var(--accent-dim); border-color: var(--coral);       color: var(--peach); }
  .fb.active.illus  { background: rgba(127,208,187,0.14); border-color: var(--illus-color); color: var(--illus-color); }
  .fb.active.pony   { background: rgba(255,158,201,0.14); border-color: var(--pony-color);  color: var(--pony-color);  }

  /* ── Botón-pastilla estrella: gradiente cálido coral → durazno ── */
  .rand-btns { display: flex; gap: 0.5rem; margin-left: auto; flex-wrap: wrap; }
  .rand-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 0.52rem 1.25rem; border-radius: 50px; border: none;
    background: linear-gradient(45deg, var(--coral) 0%, var(--peach) 100%);
    color: var(--ink);
    font-family: 'Roboto Mono', monospace; font-size: 0.74rem; font-weight: 500;
    letter-spacing: 0.09em; text-transform: uppercase;
    cursor: pointer; transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
    white-space: nowrap; box-shadow: 0 4px 16px rgba(255,136,115,0.22);
  }
  .rand-btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,136,115,0.32); }
  .rand-btn.active-rand { box-shadow: 0 0 0 2px rgba(255,223,156,0.55), 0 4px 16px rgba(255,136,115,0.28); }
  .rand-icon { display: inline-flex; transition: transform 0.4s ease; }
  .rand-btn:hover .rand-icon { transform: rotate(180deg); }

  /* ── Main ── */
  main { position: relative; z-index: 10; max-width: 2400px; margin: 0 auto; padding: 2.25rem 2rem; }

  /* ── Two-zone layout: series (left) · gallery (center) ── */
  .layout {
    display: grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr);
    grid-template-areas: "series content";
    gap: 1.75rem; align-items: start;
  }
  .side-series { grid-area: series; }
  .content     { grid-area: content; }

  /* ── Sidebar ── */
  .sidebar {
    position: sticky; top: calc(var(--ctrl-h) + 1rem);
    max-height: calc(100vh - var(--ctrl-h) - 2rem);
    display: flex; flex-direction: column;
  }
  .side-head {
    display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.85rem;
    padding-bottom: 0.6rem; border-bottom: 1px solid var(--gold-dim); flex-shrink: 0;
  }
  .side-head svg { opacity: 0.6; flex-shrink: 0; align-self: center; color: var(--gold); }
  .side-title { font-family: 'Cinzel', serif; font-size: 0.96rem; font-weight: 600; letter-spacing: 0.05em; color: var(--text); }
  .side-count { font-size: 0.68rem; color: var(--text-muted); font-family: 'Roboto Mono', monospace; }
  .side-list { overflow-y: auto; overflow-x: hidden; flex: 1; display: flex; flex-direction: column; gap: 0.3rem; padding-right: 4px; }
  .side-list::-webkit-scrollbar { width: 7px; }
  .side-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
  .side-list::-webkit-scrollbar-thumb:hover { background: var(--coral); }
  .side-list::-webkit-scrollbar-track { background: transparent; }

  /* shared compact row pieces */
  .row-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .row-name { font-size: 0.76rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-sm { font-size: 0.74rem; color: var(--text-muted); padding: 0.6rem 0.2rem; letter-spacing: 0.02em; }

  /* series rows (buttons w/ count) */
  .series-row {
    display: flex; align-items: center; gap: 10px; padding: 0.44rem 0.6rem;
    border-radius: 8px; cursor: pointer; width: 100%; text-align: left;
    background: none; border: 1px solid transparent; border-left: 2px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    font-family: 'Roboto Mono', monospace;
  }
  .series-row:hover { background: var(--surface2); border-color: var(--border); border-left-color: var(--coral); }
  .series-row.active { background: var(--surface3); border-color: rgba(255,136,115,0.4); border-left-color: var(--coral); }
  .series-row .row-name { font-family: 'Cinzel', serif; font-size: 0.78rem; font-weight: 400; letter-spacing: 0.03em; color: var(--text-sec); }
  .series-row:hover .row-name, .series-row.active .row-name { color: var(--text); }
  .se-count {
    font-size: 0.65rem; font-weight: 500; color: var(--text-sec); flex-shrink: 0;
    background: var(--surface3); padding: 0.1rem 0.52rem; border-radius: 20px;
    border: 1px solid rgba(231,198,132,0.18); min-width: 1.8rem; text-align: center;
    font-family: 'Roboto Mono', monospace;
  }
  .series-row.active .se-count { color: var(--peach); border-color: rgba(255,136,115,0.45); background: var(--accent-dim); }

  /* ── Spotlight section ── */
  .spotlight-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
  .sec-title { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.07em; color: var(--text); }
  .sec-count { font-family: 'Roboto Mono', monospace; font-size: 0.72rem; font-weight: 300; color: var(--text-muted); margin-left: 0.9rem; letter-spacing: 0.05em; }

  .spotlight-grid { display: grid; gap: 1rem; grid-template-columns: repeat(5, 1fr); }

  /* ── Cards ── */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; text-decoration: none; display: block;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    animation: fi 0.28s ease both;
  }
  @keyframes fi { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .card:hover { border-color: rgba(255,136,115,0.5); transform: translateY(-3px); box-shadow: 0 8px 22px rgba(10,6,24,0.4); }

  .ci { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: var(--surface2); }
  .ci img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .ph svg { opacity: 0.12; color: var(--peach); }

  .cb { padding: 0.72rem 0.78rem 0.8rem; }
  .cn { font-family: 'Roboto Mono', monospace; font-size: 0.84rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.24rem; letter-spacing: 0.02em; }
  .cs {
    font-family: 'Roboto Mono', monospace; font-size: 0.74rem; font-weight: 300; letter-spacing: 0.02em;
    color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.5rem;
  }
  .cs-link {
    font-family: 'Roboto Mono', monospace; font-size: 0.74rem; font-weight: 300; letter-spacing: 0.02em;
    color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.5rem;
    display: block; cursor: pointer; transition: color 0.15s;
  }
  .cs-link:hover { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
  .ct { display: flex; gap: 0.28rem; flex-wrap: wrap; }
  .t  { font-size: 0.6rem; padding: 0.13rem 0.5rem; border-radius: 20px; border: 1px solid; font-family: 'Roboto Mono', monospace; letter-spacing: 0.04em; }
  .tL { color: var(--lora-color);       border-color: rgba(255,185,143,0.4); background: rgba(255,185,143,0.1); }
  .tC { color: var(--checkpoint-color); border-color: rgba(185,160,255,0.4); background: rgba(185,160,255,0.1); }
  .tO { color: var(--other-color);      border-color: rgba(142,199,230,0.4); background: rgba(142,199,230,0.1); }
  .tI { color: var(--illus-color);      border-color: rgba(127,208,187,0.4); background: rgba(127,208,187,0.1); }
  .tP { color: var(--pony-color);       border-color: rgba(255,158,201,0.4); background: rgba(255,158,201,0.1); }

  /* ── Loading strip ── */
  .load-strip {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: rgba(4,2,9,0.95); border-top: 1px solid var(--gold-dim);
    padding: 0.65rem 1.5rem; align-items: center; gap: 1rem;
    font-family: 'Roboto Mono', monospace; font-size: 0.72rem; color: var(--text-sec); letter-spacing: 0.03em;
  }
  .load-strip.visible { display: flex; }
  .sp-sm { width: 16px; height: 16px; border: 2px solid var(--gold-dim); border-top-color: var(--coral); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-bar-wrap { flex: 1; height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .load-bar { height: 100%; background: linear-gradient(90deg, var(--coral), var(--peach)); border-radius: 2px; transition: width 0.3s; width: 0%; }

  /* ── Splash ── */
  .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 2rem; gap: 1.5rem; }
  .sp-lg { width: 36px; height: 36px; border: 2px solid var(--gold-dim); border-top-color: var(--coral); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .splash-txt { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-sec); font-family: 'Roboto Mono', monospace; }

  .empty { text-align: center; padding: 3rem 2rem; color: var(--text-muted); font-size: 0.84rem; letter-spacing: 0.03em; }
  .err { background: rgba(255,136,115,0.1); border: 1px solid rgba(255,136,115,0.34); color: #ffb6a4; padding: 1rem 1.5rem; border-radius: 10px; font-size: 0.82rem; letter-spacing: 0.02em; }

  footer { position: relative; z-index: 10; text-align: center; padding: 1.4rem; border-top: 1px solid var(--gold-dim); font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.08em; margin-top: 3rem; }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { color: var(--peach); }

  /* ── Responsive ── */
  @media (max-width: 1500px) { .spotlight-grid, .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; grid-template-areas: "content" "series"; gap: 1.25rem; }
    .sidebar { position: static; max-height: none; }
    .side-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 0.5rem; padding-right: 0; padding-bottom: 0.4rem; -webkit-overflow-scrolling: touch; }
    .series-row { flex: 0 0 auto; width: 184px; }
    .spotlight-grid, .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    header { padding: 2.25rem 1rem 1.6rem; }
    main { padding: 1.2rem 0.9rem; }
    .controls { padding: 0.75rem 0.9rem; }
    .stats-bar { gap: 1.5rem; }
    .spotlight-grid, .grid { grid-template-columns: repeat(2, 1fr); }
    .rand-btns { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .card:hover { transform: none; }
    .rand-btn:hover .rand-icon { transform: none; }
    .rand-btn:hover { transform: none; }
  }

  /* ── Lang switcher (pastillas pequeñas) ── */
  .lang-btn {
    padding: 0.34rem 0.7rem; border-radius: 50px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-family: 'Roboto Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.1em; cursor: pointer; transition: all 0.15s;
    text-transform: uppercase; font-weight: 400;
  }
  .lang-btn:hover { border-color: var(--border-hover); color: var(--text-sec); }
  .lang-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="txt-eyebrow"></div>
  <h1>Cinabrio</h1>
  <div class="sub" id="txt-sub"></div>
</header>

<div class="stats-bar">
  <div class="stat"><span class="stat-val" id="sTotal">—</span><span class="stat-label" id="txt-stat-models"></span></div>
  <div class="stat"><span class="stat-val" id="sSeries">—</span><span class="stat-label" id="txt-stat-series"></span></div>
  <div class="stat"><span class="stat-val" id="sIllus">—</span><span class="stat-label">Illustrious</span></div>
  <div class="stat"><span class="stat-val" id="sPony">—</span><span class="stat-label">Pony</span></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="q" oninput="onSearch()" onkeydown="onSearchKey(event)" autocomplete="off"/>
    <div class="ac-dropdown" id="acDropdown"></div>
  </div>
  <div class="fg">
    <button class="fb active" data-g="type" data-v="all"        onclick="setF(this,'type')" id="fb-all-type"></button>
    <button class="fb"        data-g="type" data-v="LORA"       onclick="setF(this,'type')">LoRA</button>
    <button class="fb"        data-g="type" data-v="Checkpoint" onclick="setF(this,'type')">Checkpoint</button>
  </div>
  <div class="vsep"></div>
  <div class="fg">

<script>
// ─────────────────────────────────────────────────────────────────────────────
// i18n
// ─────────────────────────────────────────────────────────────────────────────
const STRINGS = {
  en: {
    title:        'AI Model Collection',
    sub:          'Anime · Manga · Video Game Characters',
    statModels:   'Models',
    statSeries:   'Series',
    allType:      'All',
    allBase:      'All',
    btnChar:      'Random Character',
    btnColl:      'Random Collection',
    searchPH:     'Search character or series…',
    searchPHtags: 'tag1, tag2, tag3… (comma = tag filter)',
    resultsForTags: (tags) => `Tags: ${tags.join(' · ')}`,
    spotRandom:   'Random Selection',
    explore:      'Series',
    seriesCount:  n => `${n}`,
    modelCount:   n => `${n} model${n!==1?'s':''}`,
    loading:      'Connecting to Civitai…',
    loadingN:     (n,t) => t>0 ? `Loading models… ${n} / ${t}` : `Loading models… ${n}`,
    noModels:     'No models available.',
    noResults:    'No results found.',
    noCollModels: 'No models with current filter.',
    resultsFor:   q => `Results for "${q}"`,
    error:        e => `Could not connect to Civitai: ${e}. Reload to try again.`,
    footer:       'Live data via <a href="https://civitai.red/user/Cinabrio" target="_blank" rel="noopener">Civitai API</a> · Cinabrio &copy; 2025',
    unclassified: 'Unclassified',
  },
  es: {
    title:        'Colección de Modelos IA',
    sub:          'Personajes de Anime · Manga · Videojuegos',
    statModels:   'Modelos',
    statSeries:   'Series',
    allType:      'Todos',
    allBase:      'Todos',
    btnChar:      'Personaje aleatorio',
    btnColl:      'Colección aleatoria',
    searchPH:     'Buscar personaje o serie…',
    searchPHtags: 'tag1, tag2, tag3… (coma = filtro por tags)',
    resultsForTags: (tags) => `Tags: ${tags.join(' · ')}`,
    spotRandom:   'Selección aleatoria',
    explore:      'Series',
    seriesCount:  n => `${n}`,
    modelCount:   n => `${n} modelo${n!==1?'s':''}`,
    loading:      'Conectando con Civitai…',
    loadingN:     (n,t) => t>0 ? `Cargando modelos… ${n} / ${t}` : `Cargando modelos… ${n}`,
    noModels:     'Sin modelos disponibles.',
    noResults:    'No se encontraron resultados.',
    noCollModels: 'No hay modelos con el filtro actual.',
    resultsFor:   q => `Resultados para "${q}"`,
    error:        e => `No se pudo conectar con Civitai: ${e}. Recarga para intentar de nuevo.`,
    footer:       'Datos en tiempo real via <a href="https://civitai.red/user/Cinabrio" target="_blank" rel="noopener">Civitai API</a> · Cinabrio &copy; 2025',
    unclassified: 'Sin clasificar',
  }
};

let lang = 'en';
function s() { return STRINGS[lang]; }

function applyLang() {
  document.documentElement.lang = lang;
  document.title = `Cinabrio — ${s().title}`;
  document.getElementById('txt-eyebrow').textContent     = s().title;
  document.getElementById('txt-sub').textContent         = s().sub;
  document.getElementById('txt-stat-models').textContent = s().statModels;
  document.getElementById('txt-stat-series').textContent = s().statSeries;
  document.getElementById('fb-all-type').textContent     = s().allType;
  document.getElementById('fb-all-base').textContent     = s().allBase;
  document.getElementById('txt-btn-char').textContent    = s().btnChar;
  document.getElementById('txt-btn-coll').textContent    = s().btnColl;
  document.getElementById('q').placeholder = s().searchPH;
  updatePlaceholder();
  document.getElementById('txt-explore').textContent = s().explore;
  document.getElementById('txt-footer').innerHTML    = s().footer;
  document.getElementById('splashTxt').textContent   = s().loading;
  document.getElementById('langEN').classList.toggle('active', lang==='en');
  document.getElementById('langES').classList.toggle('active', lang==='es');
  if (all.length > 0) {
    renderSpotlight();
    renderSeriesList();
    updateProgress();
    const q = document.getElementById('q').value.toLowerCase().trim();
    if (q) runSearch();
  }
}

function setLang(l) { lang = l; applyLang(); }

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
const USER = 'Cinabrio';
const UNCLASSIFIED = '\u0000unclassified';   // stable internal key, language-independent

let all          = [];
let groups       = {};
let seriesKeys   = [];     // ordered by model count (used for stats/index map)
let aType        = 'all';
let aBase        = 'all';
let spotMode     = 'char';   // 'char' | 'collection' | 'manual'
let activeSeries = null;     // holds a series KEY (not display name)
let loadingDone  = false;
let estimatedTotal = 0;

const seenIds   = new Set();   // dedupe models across both domains
const nameToIdx = new Map();
const idxToName = [];

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
function parse(m) {
  const raw = m.name || '';
  const i   = raw.indexOf(' | ');
  if (i !== -1) {
    const series = raw.slice(i+3).trim();
    return { char: raw.slice(0,i).trim(), series, key: series };
  }
  return { char: raw.trim(), series: s().unclassified, key: UNCLASSIFIED };
}
function seriesDisplay(key) {
  return key === UNCLASSIFIED ? s().unclassified : key;
}
function getBase(m) {
  const bm = (m.modelVersions?.[0]?.baseModel || '').toLowerCase();
  if (bm.includes('illustrious') || bm.includes('noob')) return 'illustrious';
  if (bm.includes('pony'))  return 'pony';
  if (bm.includes('flux'))  return 'flux';
  if (bm.includes('sdxl'))  return 'sdxl';
  if (bm.includes('sd 1'))  return 'sd15';
  return 'other';
}
// Best available thumbnail — prefer a 'None'-rated image, otherwise the first.
function thumb(m) {
  const imgs = m.modelVersions?.[0]?.images || [];
  if (!imgs.length) return null;
  const safe = imgs.find(i => (i.nsfwLevel||'None')==='None');
  const img  = safe || imgs[0];
  return img?.url ? img.url.replace('/original/','/width=400/') : null;
}
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// Route each model's page link to the domain that can actually display it:
// mature models → civitai.red, SFW models → civitai.com.
function modelUrl(m) {
  return `https://${m.nsfw ? 'civitai.red' : 'civitai.com'}/models/${m.id}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Cards
// ─────────────────────────────────────────────────────────────────────────────
const PH = `<div class="ph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
window.__PH   = PH;

function typeTag(type) {
  const lbl = {LORA:'LoRA',LoCon:'LyCORIS',Checkpoint:'Checkpoint',TextualInversion:'TI',Hypernetwork:'HN'}[type]||type;
  const cls = (type==='LORA'||type==='LoCon')?'tL':type==='Checkpoint'?'tC':'tO';
  return `<span class="t ${cls}">${lbl}</span>`;
}
function baseTag(b) {
  if (b==='illustrious') return '<span class="t tI">Illustrious</span>';
  if (b==='pony')        return '<span class="t tP">Pony</span>';
  return '';
}
function cardHTML(m, linkSeries) {
  const {char, key} = parse(m);
  const img = thumb(m);
  const b   = getBase(m);
  const url = modelUrl(m);
  const imgEl = img
    ? `<img src="${img}" alt="" loading="lazy" onerror="this.parentElement.innerHTML=window.__PH"/>`
    : PH;
  const seriesEl = linkSeries
    ? `<span class="cs-link" role="link" tabindex="0" data-series="${esc(key)}" title="${esc(seriesDisplay(key))}">${esc(seriesDisplay(key))}</span>`
    : `<div class="cs" title="${esc(seriesDisplay(key))}">${esc(seriesDisplay(key))}</div>`;
  return `<a class="card" href="${url}" target="_blank" rel="noopener">
    <div class="ci">${imgEl}</div>
    <div class="cb">
      <div class="cn" title="${esc(char)}">${esc(char)}</div>
      ${seriesEl}
      <div class="ct">${typeTag(m.type)}${baseTag(b)}</div>
    </div>
  </a>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Filtering
// ─────────────────────────────────────────────────────────────────────────────
function applyTypeBase(list) {
  return list.filter(m => {
    const tOk = aType==='all'||m.type===aType||(aType==='LORA'&&m.type==='LoCon');
    const bOk = aBase==='all'||getBase(m)===aBase;
    return tOk&&bOk;
  });
}
function sortList(list) {
  return [...list].sort((a,b) => new Date(b.createdAt||0)-new Date(a.createdAt||0));
}

// ─────────────────────────────────────────────────────────────────────────────
// View helpers
// ─────────────────────────────────────────────────────────────────────────────
function goHome() {
  document.getElementById('q').value = '';
  document.getElementById('viewBrowse').style.display = 'none';
  document.getElementById('viewHome').style.display   = '';
}

// ─────────────────────────────────────────────────────────────────────────────
// LEFT sidebar — series index (compact rows, name + count, alphabetical)
// ─────────────────────────────────────────────────────────────────────────────
function seriesRowHTML(key) {
  const cnt = (groups[key]||[]).length;
  return `<button class="series-row${key===activeSeries?' active':''}" data-series="${esc(key)}" title="${esc(seriesDisplay(key))}">
    <span class="row-meta"><span class="row-name">${esc(seriesDisplay(key))}</span></span>
    <span class="se-count">${cnt}</span>
  </button>`;
}

function renderSeriesList() {
  document.getElementById('seriesListCount').textContent = s().seriesCount(seriesKeys.length);
  const keys = seriesKeys.slice().sort((a,b) => seriesDisplay(a).localeCompare(seriesDisplay(b)));
  document.getElementById('seriesList').innerHTML = keys.length
    ? keys.map(seriesRowHTML).join('')
    : `<div class="empty-sm">${s().noModels}</div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Spotlight (center)
// ─────────────────────────────────────────────────────────────────────────────
function renderSpotlight() {
  const grid = document.getElementById('spotGrid');
  grid.className = 'spotlight-grid';

  if (spotMode === 'char') {
    const picks = pickRandom(applyTypeBase(all).filter(m=>thumb(m)), 5);
    document.getElementById('spotTitle').textContent = s().spotRandom;
    document.getElementById('spotCount').textContent = '';
    grid.innerHTML = picks.map(m=>cardHTML(m,true)).join('')
      || `<div class="empty">${s().noModels}</div>`;

  } else if (spotMode === 'collection') {
    const keys = Object.keys(groups);
    if (!keys.length) return;
    const key   = keys[Math.floor(Math.random()*keys.length)];
    const items = sortList(applyTypeBase(groups[key]||[]));
    document.getElementById('spotTitle').textContent = seriesDisplay(key);
    document.getElementById('spotCount').textContent = s().modelCount(items.length);
    grid.innerHTML = items.map(m=>cardHTML(m,false)).join('')
      || `<div class="empty">${s().noModels}</div>`;
    activeSeries = null;
    renderSeriesList();

  } else if (spotMode === 'manual' && activeSeries) {
    const items = sortList(applyTypeBase(groups[activeSeries]||[]));
    document.getElementById('spotTitle').textContent = seriesDisplay(activeSeries);
    document.getElementById('spotCount').textContent = s().modelCount(items.length);
    grid.innerHTML = items.map(m=>cardHTML(m,false)).join('')
      || `<div class="empty">${s().noCollModels}</div>`;
  }
}

function pickRandom(pool, n) {
  const picks=[], used=new Set();
  let tries=0;
  while (picks.length<n && picks.length<pool.length && tries<pool.length*3) {
    const i=Math.floor(Math.random()*pool.length);
    if (!used.has(i)) { used.add(i); picks.push(pool[i]); }
    tries++;
  }
  return picks;
}

// ─────────────────────────────────────────────────────────────────────────────
// Mode & series navigation
// ─────────────────────────────────────────────────────────────────────────────
function setMode(mode) {
  spotMode = mode;
  activeSeries = null;
  goHome();
  document.getElementById('btnChar').classList.toggle('active-rand', mode==='char');
  document.getElementById('btnColl').classList.toggle('active-rand', mode==='collection');
  renderSpotlight();
  renderSeriesList();
}

function openSeriesByKey(key) {
  if (key===undefined || key===null || !groups[key]) return;
  goHome();
  if (activeSeries===key && spotMode==='manual') {
    activeSeries=null; spotMode='char';
    document.getElementById('btnChar').classList.add('active-rand');
    document.getElementById('btnColl').classList.remove('active-rand');
    renderSpotlight(); renderSeriesList();
    document.getElementById('spotGrid').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  activeSeries=key; spotMode='manual';
  document.getElementById('btnChar').classList.remove('active-rand');
  document.getElementById('btnColl').classList.remove('active-rand');
  renderSpotlight(); renderSeriesList();
  document.getElementById('spotGrid').scrollIntoView({behavior:'smooth',block:'start'});
}

// ─────────────────────────────────────────────────────────────────────────────
// Search — comma → tag AND filter, no comma → name/series
// ─────────────────────────────────────────────────────────────────────────────
let searchTimer = null;

function modelTags(m) {
  const result = new Set();
  (m.tags || []).forEach(t => result.add(String(t).toLowerCase().trim()));
  (m.modelVersions?.[0]?.trainedWords || []).forEach(entry => {
    String(entry).split(',').forEach(t => {
      const clean = t.toLowerCase().trim();
      if (clean) result.add(clean);
    });
  });
  return result;
}

function updatePlaceholder() {
  const q = document.getElementById('q').value;
  document.getElementById('q').placeholder = q.includes(',') ? s().searchPHtags : s().searchPH;
}

function onSearch() {
  const raw = document.getElementById('q').value;
  updatePlaceholder();

  const frag = currentFragment(raw);
  if (frag.length >= 1) renderDropdown(frag);
  else closeDropdown();

  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 160);
}

function runSearch() {
  const raw = document.getElementById('q').value;
  const q   = raw.toLowerCase().trim();

  if (!q) {
    document.getElementById('viewBrowse').style.display='none';
    document.getElementById('viewHome').style.display='';
    return;
  }

  let results, titleText;

  if (raw.includes(',')) {
    const tags = q.split(',').map(t => t.trim()).filter(t => t.length > 0);
    results = sortList(applyTypeBase(all).filter(m => {
      const mTags = [...modelTags(m)];
      return tags.every(tag => mTags.some(mt => mt.includes(tag)));
    }));
    titleText = s().resultsForTags(tags);
  } else {
    results = sortList(applyTypeBase(all).filter(m => {
      const {char, key} = parse(m);
      return char.toLowerCase().includes(q) || seriesDisplay(key).toLowerCase().includes(q);
    }));
    titleText = s().resultsFor(q);
  }

  document.getElementById('browseTitle').textContent = titleText;
  document.getElementById('browseCount').textContent = s().modelCount(results.length);
  document.getElementById('browseGrid').innerHTML = results.length
    ? results.map(m => cardHTML(m, true)).join('')
    : `<div class="empty" style="grid-column:1/-1">${s().noResults}</div>`;
  document.getElementById('viewHome').style.display='none';
  document.getElementById('viewBrowse').style.display='';
}

function setF(btn, g) {
  document.querySelectorAll(`[data-g="${g}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (g==='type') aType=btn.dataset.v;
  if (g==='base') aBase=btn.dataset.v;
  const q=document.getElementById('q').value.toLowerCase().trim();
  if (q) runSearch();
  else { renderSpotlight(); renderSeriesList(); }
}

// ─────────────────────────────────────────────────────────────────────────────
// Stats & groups
// ─────────────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('sTotal').textContent  = all.length.toLocaleString();
  document.getElementById('sSeries').textContent = seriesKeys.length;
  document.getElementById('sIllus').textContent  = all.filter(m=>getBase(m)==='illustrious').length;
  document.getElementById('sPony').textContent   = all.filter(m=>getBase(m)==='pony').length;
}

let tagIndex = new Map();
function rebuildTagIndex() {
  tagIndex.clear();
  all.forEach(m => { modelTags(m).forEach(tag => tagIndex.set(tag, (tagIndex.get(tag) || 0) + 1)); });
}

function rebuildGroups() {
  const prevActive = activeSeries;
  groups={};
  all.forEach(m=>{ const key=parse(m).key; (groups[key]||(groups[key]=[])).push(m); });
  seriesKeys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  nameToIdx.clear(); idxToName.length=0;
  seriesKeys.forEach((key,i)=>{ nameToIdx.set(key,i); idxToName[i]=key; });
  activeSeries=(prevActive&&groups[prevActive])?prevActive:activeSeries;
  rebuildTagIndex();
}

// ─────────────────────────────────────────────────────────────────────────────
// Autocomplete
// ─────────────────────────────────────────────────────────────────────────────
let acFocusIdx = -1;

function currentFragment(val) {
  const lastComma = val.lastIndexOf(',');
  return lastComma === -1 ? val.trim() : val.slice(lastComma + 1).trimStart();
}
function currentPrefix(val) {
  const lastComma = val.lastIndexOf(',');
  return lastComma === -1 ? '' : val.slice(0, lastComma + 1) + ' ';
}

function renderDropdown(fragment) {
  const dd = document.getElementById('acDropdown');
  if (!fragment || fragment.length < 1) { closeDropdown(); return; }

  const frag = fragment.toLowerCase();
  const matches = [...tagIndex.entries()]
    .filter(([tag]) => tag.includes(frag))
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);

  if (!matches.length) { closeDropdown(); return; }

  acFocusIdx = -1;
  dd.innerHTML = matches.map(([tag, count], i) => {
    const hi = tag.replace(
      new RegExp(frag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
      match => `<em>${match}</em>`
    );
    return `<button class="ac-item" data-idx="${i}" data-tag="${esc(tag)}"
      onmousedown="acSelect(this.dataset.tag)" onmouseover="acHover(${i})">
      <span class="ac-item-tag">${hi}</span>
      <span class="ac-item-count">${count}</span>
    </button>`;
  }).join('');

  dd.classList.add('open');
}

function closeDropdown() {
  document.getElementById('acDropdown').classList.remove('open');
  acFocusIdx = -1;
}

function acSelect(tag) {
  const input = document.getElementById('q');
  const prefix = currentPrefix(input.value);
  input.value = prefix + tag + ', ';
  closeDropdown();
  input.focus();
  updatePlaceholder();
  runSearch();
}

function acHover(idx) {
  acFocusIdx = idx;
  document.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('focused', i === idx));
}

function onSearchKey(e) {
  const dd = document.getElementById('acDropdown');
  const items = dd.querySelectorAll('.ac-item');
  const isOpen = dd.classList.contains('open');

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!isOpen) return;
    acFocusIdx = Math.min(acFocusIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('focused', i === acFocusIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!isOpen) return;
    acFocusIdx = Math.max(acFocusIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('focused', i === acFocusIdx));
  } else if ((e.key === 'Tab' || e.key === 'Enter') && isOpen && acFocusIdx >= 0) {
    e.preventDefault();
    const tag = items[acFocusIdx]?.dataset.tag;
    if (tag) acSelect(tag);
  } else if (e.key === 'Escape') {
    closeDropdown();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Global click delegation — series rows + in-card series links
// ─────────────────────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const cs = e.target.closest('.cs-link');
  if (cs) { e.preventDefault(); e.stopPropagation(); openSeriesByKey(cs.dataset.series); return; }

  const row = e.target.closest('.series-row');
  if (row) { openSeriesByKey(row.dataset.series); return; }

  if (!e.target.closest('.search-wrap')) closeDropdown();
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('cs-link')) {
    e.preventDefault();
    openSeriesByKey(e.target.dataset.series);
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// API load
// ─────────────────────────────────────────────────────────────────────────────
function updateProgress() {
  const pct = estimatedTotal>0 ? Math.min(100,Math.round(all.length/estimatedTotal*100)) : 0;
  document.getElementById('loadBar').style.width = pct+'%';
  document.getElementById('loadTxt').textContent = s().loadingN(all.length, estimatedTotal);
}

// Two content domains after Civitai's red/green split (Apr 2026):
//   · civitai.com → "green": only SFW (PG / PG-13); mature content is filtered out.
//   · civitai.red → mature levels (R / X / XXX); SFW-only models don't surface here.
// The /models endpoint ignores `browsingLevel` (unknown params are dropped) and its
// level filtering is driven by the request domain, so neither domain returns the
// full library on its own. We pull from BOTH and merge, deduping by model id.
const SOURCES = ['https://civitai.red', 'https://civitai.com'];

function addItems(items) {
  for (const m of (items||[])) {
    if (m && m.id!=null && !seenIds.has(m.id)) { seenIds.add(m.id); all.push(m); }
  }
}
function currentQuery() { return document.getElementById('q').value.toLowerCase().trim(); }
function updateManualCount() {
  if (spotMode==='manual' && activeSeries)
    document.getElementById('spotCount').textContent = s().modelCount((groups[activeSeries]||[]).length);
}

async function fetchPage(base, cursor) {
  let url = `${base}/api/v1/models?username=${USER}&limit=100&sort=Newest&nsfw=true`;
  if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

let paintedOnce = false;
function firstPaint() {
  if (paintedOnce) return;
  paintedOnce = true;
  document.getElementById('splash').style.display = 'none';
  document.getElementById('layout').style.display = '';
  document.getElementById('viewHome').style.display = '';
  document.getElementById('loadStrip').classList.add('visible');
  renderSpotlight();
  renderSeriesList();
}

async function loadDomain(base) {
  let cursor = null, page = 0, first = true, ok = false;
  do {
    if (!first) await new Promise(r => setTimeout(r, 220));
    const data = await fetchPage(base, cursor);
    addItems(data.items || []);
    if (first) estimatedTotal += (data.metadata?.totalItems || 0);
    first = false; ok = true;
    rebuildGroups(); updateStats();
    firstPaint();
    updateProgress();
    if (!currentQuery()) { renderSeriesList(); updateManualCount(); }
    cursor = data.metadata?.nextCursor || null;
    page++;
  } while (cursor && page < 50);
  return ok;
}

async function loadAll() {
  document.getElementById('splash').style.display = 'flex';
  let anyOk = false, lastErr = null;
  for (const base of SOURCES) {
    try { if (await loadDomain(base)) anyOk = true; }
    catch (e) { lastErr = e; console.warn('Civitai source failed:', base, e.message); }
  }
  document.getElementById('loadStrip').classList.remove('visible');
  loadingDone = true;
  if (!anyOk) {
    document.getElementById('splash').style.display = 'none';
    const el = document.getElementById('viewError');
    el.textContent = s().error(lastErr ? lastErr.message : 'unknown');
    el.style.display = 'block';
  } else {
    firstPaint(); // ensure the layout is shown even if a domain returned zero items
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
applyLang();
loadAll();
</script>
